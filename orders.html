<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders | GlowMart</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="nav" class="site-header"></header>

  <main class="container">
    <div class="page-title"><h1>Orders</h1></div>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="buy" aria-selected="true">My purchases</button>
      <button type="button" role="tab" data-tab="sell" aria-selected="false" hidden>Orders received</button>
    </div>
    <p id="msg" class="msg" hidden></p>
    <div id="list"><p class="empty">Loading...</p></div>
  </main>

  <footer id="footer"></footer>
  <script type="module" src="orders.js"></script>
</body>
</html>
